[project]
name = "wrenchctl"
version = "0.1.0"
description = "The WRENCH agent CLI: the only tool inside the sandbox. Talks HTTP to the agent API."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
wrenchctl = "wrenchctl.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["wrenchctl"]
