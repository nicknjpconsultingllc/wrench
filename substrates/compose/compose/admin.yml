# The admin project: nothing in here is reachable from the agent surface.
# loadgen, probe and toxiproxy also attach to the factory network because
# they have to touch it (send jobs, read Postgres, sit on the worker->redis
# hop), but every listener they have binds to a static admin-network IP:
# toxiproxy's control API on .10, the probe on .11, chaos's admin routes on
# .20. chaos is the only container holding the Docker socket; it also joins
# the factory network (10.232.<slot>.20, alias `wrenchapi`) to serve the
# agent API on 8081 there, and only there.
# No container publishes a port: a published port is reachable from every
# bridge on the host (and via host.docker.internal on Docker Desktop), so
# the episode runner reaches the probe with `docker exec` instead.
# Secrets (HMAC key, analytics password) come from files the episode runner
# generates per run under WRENCH_SECRETS_DIR; no default exists.
name: ${WRENCH_ADMIN_PROJECT:-wrench-admin-0}

x-admin: &admin
  restart: "no"
  logging:
    driver: json-file
    options: { max-size: "5m", max-file: "1" }

services:
  toxiproxy:
    <<: *admin
    image: ghcr.io/shopify/toxiproxy@sha256:cfdb2ca7ac7131a650d09db49782cc33e5c5d97fd3be5b3a6e27cd13d0ee8d57 # 2.11.0
    command: ["-host", "10.231.${WRENCH_SLOT:-0}.10", "-port", "8474", "-config", "/config/toxiproxy.json"]
    volumes:
      - ./toxiproxy.json:/config/toxiproxy.json:ro
    labels:
      wrench.role: admin
    networks:
      admin:
        ipv4_address: 10.231.${WRENCH_SLOT:-0}.10
      factory:
        aliases: [netproxy]

  loadgen:
    <<: *admin
    image: wrench-svc:local
    command: python -m loadgen.main
    environment:
      GATEWAY_URL: http://gateway:8000
      RPS: ${WRENCH_RPS:-8}
      SEED: ${WRENCH_SEED:-1}
      HMAC_KEY_FILE: /run/secrets/hmac_key
    secrets: [hmac_key]
    labels:
      wrench.role: admin
    networks: [admin, factory]

  probe:
    <<: *admin
    image: wrench-svc:local
    command: python -m probe.main
    environment:
      PG_DSN: postgresql://probe:probe@postgres:5432/factory
      REDIS_URL: redis://redis:6379/0
      GATEWAY_URL: http://gateway:8000
      HMAC_KEY_FILE: /run/secrets/hmac_key
      CHAOS_URL: http://10.231.${WRENCH_SLOT:-0}.20:8080
      BIND: 10.231.${WRENCH_SLOT:-0}.11
      SAMPLE_MS: ${WRENCH_SAMPLE_MS:-500}
      ITEM: jobs_done
    secrets: [hmac_key]
    labels:
      wrench.role: admin
    networks:
      admin:
        ipv4_address: 10.231.${WRENCH_SLOT:-0}.11
      factory: {}

  chaos:
    <<: *admin
    image: wrench-svc:local
    command: python -m chaos.main
    environment:
      FACTORY_PROJECT: ${WRENCH_FACTORY_PROJECT:-wrench-factory-0}
      FACTORY_NET: ${WRENCH_FACTORY_NET:-wrench_factory_0}
      ADMIN_PROJECT: ${WRENCH_ADMIN_PROJECT:-wrench-admin-0}
      TOXIPROXY_URL: http://10.231.${WRENCH_SLOT:-0}.10:8474
      PROBE_URL: http://10.231.${WRENCH_SLOT:-0}.11:8080
      ADMIN_BIND: 10.231.${WRENCH_SLOT:-0}.20
      AGENT_BIND: 10.232.${WRENCH_SLOT:-0}.20
      HOG_IMAGE: wrench-svc:local
      ANALYTICS_PASSWORD_FILE: /run/secrets/analytics_password
      SCALE_CAP: "4"
    secrets: [analytics_password]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    labels:
      wrench.role: admin
    networks:
      admin:
        ipv4_address: 10.231.${WRENCH_SLOT:-0}.20
      factory:
        ipv4_address: 10.232.${WRENCH_SLOT:-0}.20
        aliases: [wrenchapi]

secrets:
  hmac_key:
    file: ${WRENCH_SECRETS_DIR:-/wrench-secrets-unset}/hmac.key
  analytics_password:
    file: ${WRENCH_SECRETS_DIR:-/wrench-secrets-unset}/analytics.pw

networks:
  admin:
    name: ${WRENCH_ADMIN_NET:-wrench_admin_0}
    ipam:
      config:
        - subnet: 10.231.${WRENCH_SLOT:-0}.0/24
  factory:
    external: true
    name: ${WRENCH_FACTORY_NET:-wrench_factory_0}
