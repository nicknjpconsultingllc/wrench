[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wrench-core"
version = "0.1.0"
description = "WRENCH disruption-recovery measurement core: scorers, ledger, survival curves"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = [
    "pydantic>=2.10",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.hatch.build.targets.wheel]
packages = ["wrench_core"]

[tool.pytest.ini_options]
testpaths = "tests"
python_files = "test_*.py"
